<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Today">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">
  <title>Today</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Set the theme before first paint so there is no flash.
    try {
      var s = JSON.parse(localStorage.getItem('today.v1') || '{}').settings || {};
      document.documentElement.dataset.theme = s.theme || 'dark';
    } catch (e) {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">
    <div class="status-scrim" aria-hidden="true"></div>

    <main id="scroller">
      <div class="wrap">
        <header class="top">
          <div class="top-row">
            <button class="streak zero" id="streak" type="button" aria-label="Streak and history">
              <span class="flame" aria-hidden="true">🔥</span><span id="streak-n">0</span>
            </button>
            <button class="icon-btn" id="gear" type="button" aria-label="Settings"></button>
          </div>
          <div class="hero">
            <div class="date">
              <h1 id="weekday">Today</h1>
              <p id="monthday"></p>
            </div>
            <div class="ring" id="ring" role="img" aria-label="Progress">
              <svg viewBox="0 0 120 120" aria-hidden="true">
                <circle class="track" cx="60" cy="60" r="50" pathLength="100" fill="none" stroke-width="13"/>
                <circle class="bar" id="ring-bar" cx="60" cy="60" r="50" pathLength="100" fill="none" stroke-width="13" stroke-dasharray="100" stroke-dashoffset="100"/>
              </svg>
              <div class="ring-label"><span><span id="pct">0</span><small>%</small></span><em id="ring-sub"></em></div>
            </div>
          </div>
        </header>

        <div id="carry"></div>
        <div id="groups"></div>
        <div id="empty" class="empty" hidden></div>
      </div>
    </main>

    <button id="fab" type="button" aria-label="Add task"></button>
    <div id="toast-root"></div>
    <div id="sheet-root"></div>
    <div id="celebrate" aria-live="polite">
      <div class="cel-word">Done.</div>
      <div class="cel-sub"></div>
    </div>
    <canvas id="confetti" aria-hidden="true"></canvas>
  </div>
</body>
</html>
