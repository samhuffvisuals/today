<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Today">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">
  <title>Today</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">
    <div class="glow" aria-hidden="true"></div>
    <div class="status-scrim" aria-hidden="true"></div>

    <main id="scroller">
      <div class="wrap">
        <header class="top">
          <div class="top-row">
            <button class="days zero" id="days" type="button" aria-label="Days done and history">
              <span class="days-icon" id="days-icon" aria-hidden="true"></span><span id="days-n">0</span><span class="days-word">days</span>
            </button>
            <button class="icon-btn" id="gear" type="button" aria-label="Settings"></button>
          </div>
          <div class="hero">
            <div class="date">
              <h1 id="weekday">Today</h1>
              <p id="monthday"></p>
            </div>
            <div class="ring" id="ring" role="img" aria-label="Progress">
              <svg viewBox="0 0 120 120" aria-hidden="true">
                <circle class="track" cx="60" cy="60" r="50" pathLength="100" fill="none" stroke-width="14"/>
                <circle class="bar" id="ring-bar" cx="60" cy="60" r="50" pathLength="100" fill="none" stroke-width="14" stroke-dasharray="100" stroke-dashoffset="100"/>
              </svg>
              <div class="ring-label"><span><span id="pct">0</span><small>%</small></span></div>
            </div>
          </div>
          <p class="mood" id="mood" aria-live="polite"></p>
          <blockquote class="quote" id="quote"><span class="q-text"></span><cite class="q-src"></cite></blockquote>
        </header>

        <div id="packs" class="packs" aria-label="Task packs"></div>
        <div id="carry"></div>
        <div id="groups"></div>
        <div id="empty" class="empty" hidden></div>
      </div>
    </main>

    <button id="fab" type="button" aria-label="Add task"></button>
    <div id="toast-root"></div>
    <div id="sheet-root"></div>
    <div id="celebrate" aria-live="polite" data-haptic>
      <div class="cel-inner">
        <div class="cel-word">DONE</div>
        <div class="cel-sub"></div>
        <ul class="cel-list"></ul>
        <div class="cel-stat"></div>
        <div class="cel-hint">Tap to continue</div>
      </div>
    </div>
    <canvas id="confetti" aria-hidden="true"></canvas>
  </div>
</body>
</html>
